<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOC Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1016; --panel:#121a23; --panel2:#17212c; --line:#223040; --text:#dbe4ee; --muted:#8597aa;
  --accent:#3fb6c9; --critical:#e5484d; --high:#f2853a; --medium:#e5c23d; --low:#4fa3e0; --informational:#71808f;
  --ok:#3fbf7f; --mono:"JetBrains Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:270px 1fr;height:100vh}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:16px;letter-spacing:.2px}
.brand span{color:var(--muted);font-size:12px}
.cases{overflow:auto;padding:8px}
.case-btn{display:block;width:100%;text-align:right;background:none;border:1px solid transparent;border-radius:8px;padding:10px 12px;margin-bottom:4px}
.case-btn:hover{background:var(--panel2)}
.case-btn.active{background:var(--panel2);border-color:var(--line)}
.case-btn .num{font-family:var(--mono);color:var(--accent);font-size:12px}
.case-btn .t{display:block;font-weight:600}
.case-btn .meta{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--informational);display:inline-block}
.dot.on{background:var(--ok)}
main{overflow:auto;min-width:0}
.head{position:sticky;top:0;z-index:5;background:rgba(11,16,22,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:16px 24px 0}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.sub code{font-family:var(--mono);color:var(--text)}
.run{background:var(--accent);color:#04161a;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
.run:disabled{opacity:.6;cursor:wait}
.tabs{display:flex;gap:4px;margin-top:14px}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);font-weight:500}
.tab.active{color:var(--text);border-color:var(--accent)}
.content{padding:20px 24px 40px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .v{font-size:28px;font-weight:700;font-family:var(--mono);line-height:1.2}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi::before{content:"";position:absolute;inset:0 0 auto auto;width:3px;height:100%;background:var(--c,var(--accent))}
.two{grid-template-columns:1fr 1fr}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--muted)}
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;margin-bottom:8px}
.bars .lbl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.bars .track{grid-column:1/-1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:-4px}
.bars .fill{height:100%;border-radius:3px;background:var(--accent)}
.bars .n{font-family:var(--mono);font-size:12px;text-align:left}
.sev{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2);margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-left:6px}
.timeline svg{width:100%;height:150px;display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--c,var(--accent));background:var(--panel2)}
.search{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;color:var(--text);font:inherit}
.count{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;text-align:right;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--panel2)}
.mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
td.mono{white-space:nowrap}
td.mono.trunc,.detail td{white-space:normal}
.ltr{direction:ltr;text-align:left;unicode-bidi:isolate}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:70vh}
.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:600;color:#0b1016;background:var(--c)}
.detail td{background:#0e151d;padding:12px 16px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left}
.kv .k{color:var(--accent)}
.kv .v{word-break:break-all;white-space:pre-wrap}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.readme{max-width:860px}
.readme h1{display:none}
.readme h2{font-size:16px;border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:22px}
.readme pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;direction:ltr;text-align:left;overflow:auto;font-family:var(--mono);font-size:12.5px}
.readme code{font-family:var(--mono);background:var(--panel2);padding:0 4px;border-radius:4px;direction:ltr;unicode-bidi:isolate}
.readme li{margin:6px 0}
.trunc{max-width:520px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log{background:#05090d;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;direction:ltr;text-align:left;white-space:pre-wrap;max-height:260px;overflow:auto;margin-top:12px}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}aside{border-left:0;border-bottom:1px solid var(--line)}.cases{display:flex;overflow-x:auto}.case-btn{min-width:200px}.two{grid-template-columns:1fr}main{overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>مختبر صيد التهديدات</b><span>SOC Hunting Lab</span></div>
    <div class="cases" id="cases"></div>
  </aside>
  <main>
    <div class="head" id="head"></div>
    <div class="content" id="content"></div>
  </main>
</div>
<script>
const LEVELS = ["critical","high","medium","low","informational"];
const LEVEL_AR = {critical:"حرج",high:"عالٍ",medium:"متوسط",low:"منخفض",informational:"معلوماتي"};
const state = { cases: [], current: null, data: null, tab: "overview", filter: new Set(LEVELS), q: "", open: null };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssLevel = l => `var(--${LEVELS.includes(l) ? l : "informational"})`;

function parseTime(t){
  if (!t) return NaN;
  if (/^\d+(\.\d+)?$/.test(t)) return parseFloat(t) * 1000;
  let s = t.trim().replace(" UTC", "Z").replace(/^(\d{4}-\d\d-\d\d) /, "$1T").replace(/ ([+-]\d\d:\d\d)$/, "$1");
  return Date.parse(s);
}
const fmtTime = ms => isNaN(ms) ? "" : new Date(ms).toISOString().replace("T"," ").slice(0,19);
function count(arr, key){
  const m = new Map();
  for (const x of arr){ const ks = Array.isArray(key(x)) ? key(x) : [key(x)]; for (const k of ks) if (k) m.set(k, (m.get(k)||0)+1); }
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}

async function api(path, opts){ const r = await fetch(path, opts); return r.json(); }

async function loadCases(){
  state.cases = await api("/api/cases");
  renderCases();
  const want = (location.hash.slice(1)) || (state.cases[0] && state.cases[0].id);
  if (want) selectCase(want);
}

function renderCases(){
  $("#cases").innerHTML = state.cases.map(c => `
    <button class="case-btn ${state.current===c.id?"active":""}" data-id="${c.id}">
      <span class="num">${esc(c.id.toUpperCase())}</span>
      <span class="t">${esc(c.title.replace(/^القضية \d+:\s*/, ""))}</span>
      <span class="meta"><span class="dot ${c.analyzed?"on":""}"></span>${c.analyzed?"محلّلة":"لم تُحلّل"} · ${esc(c.level)} · ${c.kind==="network"?"شبكة":"ويندوز"}</span>
    </button>`).join("");
  document.querySelectorAll(".case-btn").forEach(b => b.onclick = () => selectCase(b.dataset.id));
}

async function selectCase(id){
  state.current = id; state.open = null; state.q = ""; state.filter = new Set(LEVELS);
  location.hash = id;
  renderCases();
  state.data = await api("/api/case?id=" + encodeURIComponent(id));
  if (!["overview","questions"].includes(state.tab)) state.tab = "overview";
  render();
}

function tabsFor(d){
  if (d.kind === "network") return [["overview","نظرة عامة"],["dns","DNS"],["conn","الاتصالات"],["questions","الأسئلة"]];
  return [["overview","نظرة عامة"],["alerts","تنبيهات Hayabusa"],["sigma","كشف Sigma"],["questions","الأسئلة"]];
}

function render(){
  const d = state.data;
  const analyzed = d.kind === "network" ? !!d.zeek : !!d.hayabusa;
  $("#head").innerHTML = `
    <div class="head-row">
      <div><h1>${esc(d.title)}</h1>
        <div class="sub"><span>المستوى: ${esc(d.level)}</span><span>الأدلة: ${d.evidence.map(e=>`<code>${esc(e)}</code>`).join(" ")}</span></div></div>
      <button class="run" id="run">${analyzed ? "إعادة التحليل" : "تحليل الأدلة"}</button>
    </div>
    <div class="tabs">${tabsFor(d).map(([k,v])=>`<button class="tab ${state.tab===k?"active":""}" data-t="${k}">${v}</button>`).join("")}</div>`;
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { state.tab = b.dataset.t; state.open = null; render(); });
  $("#run").onclick = runAnalysis;
  const c = $("#content");
  if (state.tab === "questions") return c.innerHTML = `<div class="readme">${md(d.readme)}</div>`;
  if (!analyzed) return c.innerHTML = `<div class="empty"><b>لم تُحلّل هذه القضية بعد</b>اضغط «تحليل الأدلة» لتشغيل ${d.kind==="network"?"Zeek":"Hayabusa و Chainsaw"} على الأدلة.</div>`;
  if (d.kind === "network") return renderNetwork(c, d);
  renderWindows(c, d);
}

async function runAnalysis(){
  const b = $("#run"); b.disabled = true; b.textContent = "جارٍ التحليل...";
  const r = await api("/api/run?id=" + encodeURIComponent(state.current), {method:"POST"});
  state.cases = await api("/api/cases");
  await selectCase(state.current);
  if (!r.ok) $("#content").insertAdjacentHTML("afterbegin", `<div class="log">${esc(r.output)}</div>`);
}

/* ---------- charts ---------- */
function bars(entries, opts={}){
  const max = Math.max(1, ...entries.map(e=>e[1]));
  return `<div class="bars">${entries.slice(0, opts.limit||8).map(([k,n])=>`
    <div class="row"><span class="lbl" title="${esc(k)}">${esc(k)}</span><span class="n">${n}</span>
    <div class="track"><div class="fill" style="width:${n/max*100}%;background:${opts.color?opts.color(k):"var(--accent)"}"></div></div></div>`).join("")}</div>`;
}
function timeline(times, levels){
  const pts = times.map((t,i)=>[t, levels ? levels[i] : null]).filter(p=>!isNaN(p[0]));
  if (!pts.length) return `<div class="count">لا توجد أوقات</div>`;
  let min = Math.min(...pts.map(p=>p[0])), max = Math.max(...pts.map(p=>p[0]));
  if (max === min) { min -= 30000; max += 30000; }
  const N = 40, W = 800, H = 130, bw = W / N;
  const bins = Array.from({length:N}, () => ({}));
  for (const [t,l] of pts){ const i = Math.min(N-1, Math.floor((t-min)/(max-min)*N)); bins[i][l||"x"] = (bins[i][l||"x"]||0)+1; }
  const tot = bins.map(b => Object.values(b).reduce((a,c)=>a+c,0));
  const top = Math.max(...tot);
  const order = levels ? [...LEVELS].reverse() : ["x"];
  let rects = "";
  bins.forEach((b,i) => { let y = H; for (const l of order){ const n = b[l]||0; if(!n) continue; const h = n/top*(H-6); y -= h;
    rects += `<rect x="${W-(i+1)*bw+1}" y="${y}" width="${bw-2}" height="${h}" rx="1.5" fill="${l==="x"?"var(--accent)":cssLevel(l)}"><title>${n}</title></rect>`; } });
  return `<svg viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="none">${rects}
    <text x="${W}" y="${H+16}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="JetBrains Mono">${fmtTime(min)}</text>
    <text x="0" y="${H+16}" fill="var(--muted)" font-size="11" font-family="JetBrains Mono">${fmtTime(max)}</text></svg>`;
}
const kpi = (v,l,c) => `<div class="kpi" style="--c:${c||"var(--accent)"}"><div class="v">${v}</div><div class="l">${l}</div></div>`;

/* ---------- windows ---------- */
function renderWindows(c, d){
  const hb = d.hayabusa || [], sg = d.sigma || [];
  if (state.tab === "overview"){
    const byL = Object.fromEntries(LEVELS.map(l=>[l, hb.filter(r=>r.level===l).length]));
    const total = hb.length || 1;
    c.innerHTML = `
      <div class="grid kpis">
        ${kpi(hb.length,"تنبيهات Hayabusa")}
        ${kpi(byL.critical+byL.high,"حرج / عالٍ","var(--high)")}
        ${kpi(byL.medium,"متوسط","var(--medium)")}
        ${kpi(sg.length,"أحداث طابقت Sigma","var(--low)")}
        ${kpi(new Set(hb.map(r=>r.computer)).size,"أجهزة","var(--informational)")}
      </div>
      <div class="card" style="margin-top:14px"><h3>توزيع الخطورة</h3>
        <div class="sev">${LEVELS.map(l=>byL[l]?`<div style="width:${byL[l]/total*100}%;background:${cssLevel(l)}" title="${LEVEL_AR[l]}: ${byL[l]}"></div>`:"").join("")}</div>
        <div class="legend">${LEVELS.map(l=>`<span><i style="background:${cssLevel(l)}"></i>${LEVEL_AR[l]} ${byL[l]}</span>`).join("")}</div></div>
      <div class="card timeline" style="margin-top:14px"><h3>الخط الزمني للتنبيهات (UTC)</h3>${timeline(hb.map(r=>parseTime(r.time)), hb.map(r=>r.level))}</div>
      <div class="grid two" style="margin-top:14px">
        <div class="card"><h3>أكثر قواعد Hayabusa تنبيهًا</h3>${bars(count(hb.filter(r=>r.level!=="informational"), r=>r.rule))}</div>
        <div class="card"><h3>أكثر قواعد Sigma تطابقًا</h3>${sg.length?bars(count(sg, r=>r.rules), {color:()=>"var(--low)"}):`<div class="count">لا توجد مطابقات</div>`}</div>
        <div class="card"><h3>أرقام الأحداث (Event ID)</h3>${bars(count(hb, r=>r.eid ? "EID " + r.eid : ""), {color:()=>"var(--informational)"})}</div>
        <div class="card"><h3>الأجهزة</h3>${bars(count(hb, r=>r.computer), {color:()=>"var(--informational)"})}</div>
      </div>`;
    return;
  }
  if (state.tab === "alerts"){
    const q = state.q.toLowerCase();
    const rows = hb.map((r,i)=>({...r,i})).filter(r => state.filter.has(r.level) && (!q || (r.rule+r.details+r.extra+r.computer+r.eid).toLowerCase().includes(q)));
    c.innerHTML = toolbar(true, rows.length, hb.length) + `<div class="wrap"><table>
      <thead><tr><th>الوقت (UTC)</th><th>الخطورة</th><th>القاعدة</th><th>الجهاز</th><th>EID</th><th>التفاصيل</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="r" data-i="${r.i}"><td class="mono">${fmtTime(parseTime(r.time))}</td>
        <td><span class="badge" style="--c:${cssLevel(r.level)}">${LEVEL_AR[r.level]||esc(r.level)}</span></td>
        <td class="ltr">${esc(r.rule)}</td><td class="mono">${esc(r.computer)}</td><td class="mono">${esc(r.eid)}</td>
        <td class="mono trunc">${esc(r.details)}</td></tr>
        ${state.open===r.i?`<tr class="detail"><td colspan="6">${kvBlock((r.details+" ¦ "+r.extra).split(" ¦ "), ": ")}</td></tr>`:""}`).join("")}
      </tbody></table></div>`;
    bindToolbar(); bindRows(); return;
  }
  if (state.tab === "sigma"){
    const q = state.q.toLowerCase();
    const rows = sg.map((r,i)=>({...r,i})).filter(r => !q || (r.rules.join(" ")+r.data+r.computer+r.eid).toLowerCase().includes(q));
    c.innerHTML = toolbar(false, rows.length, sg.length) + (sg.length ? `<div class="wrap"><table>
      <thead><tr><th>الوقت (UTC)</th><th>قواعد Sigma</th><th>الجهاز</th><th>EID</th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="r" data-i="${r.i}"><td class="mono">${fmtTime(parseTime(r.time))}</td>
        <td class="ltr">${r.rules.map(esc).join("<br>")}</td><td class="mono">${esc(r.computer)}</td><td class="mono">${esc(r.eid)}</td></tr>
        ${state.open===r.i?`<tr class="detail"><td colspan="4">${kvBlock(r.data.split("\n"), ": ")}</td></tr>`:""}`).join("")}
      </tbody></table></div>` : `<div class="empty"><b>لا توجد مطابقات Sigma</b>اعتمد على تنبيهات Hayabusa والسجلات الخام في هذه القضية.</div>`);
    bindToolbar(); bindRows(); return;
  }
}

function kvBlock(lines, sep){
  return `<div class="kv">${lines.filter(Boolean).map(l=>{ const i = l.indexOf(sep); return i>0
    ? `<span class="k">${esc(l.slice(0,i).trim())}</span><span class="v">${esc(l.slice(i+sep.length))}</span>`
    : `<span class="k"></span><span class="v">${esc(l)}</span>`; }).join("")}</div>`;
}

function toolbar(levels, n, total){
  return `<div class="toolbar">${levels?LEVELS.map(l=>`<button class="chip ${state.filter.has(l)?"on":""}" data-l="${l}" style="--c:${cssLevel(l)}">${LEVEL_AR[l]}</button>`).join(""):""}
    <input class="search" id="q" placeholder="ابحث..." value="${esc(state.q)}"><span class="count">${n} من ${total}</span></div>`;
}
function bindToolbar(){
  document.querySelectorAll(".chip").forEach(b => b.onclick = () => { const l = b.dataset.l; state.filter.has(l) ? state.filter.delete(l) : state.filter.add(l); render(); });
  const q = $("#q"); q.oninput = () => { state.q = q.value; const pos = q.selectionStart; render(); const n = $("#q"); n.focus(); n.setSelectionRange(pos,pos); };
}
function bindRows(){
  document.querySelectorAll("tr.r").forEach(tr => tr.onclick = () => { const i = +tr.dataset.i; state.open = state.open===i ? null : i; const y = $("main").scrollTop; render(); $("main").scrollTop = y; });
}

/* ---------- network ---------- */
function renderNetwork(c, d){
  const dns = (d.zeek.dns||{}).rows || [], conn = (d.zeek.conn||{}).rows || [];
  const base = q => q.split(".").slice(-2).join(".");
  if (state.tab === "overview"){
    c.innerHTML = `
      <div class="grid kpis">
        ${kpi(conn.length,"اتصالات")}
        ${kpi(dns.length,"طلبات DNS","var(--low)")}
        ${kpi(new Set(dns.map(r=>r.query)).size,"أسماء مختلفة","var(--medium)")}
        ${kpi(new Set(conn.map(r=>r["id.orig_h"])).size,"أجهزة مصدر","var(--informational)")}
      </div>
      <div class="card timeline" style="margin-top:14px"><h3>الخط الزمني لطلبات DNS (UTC)</h3>${timeline(dns.map(r=>parseTime(r.ts)))}</div>
      <div class="grid two" style="margin-top:14px">
        <div class="card"><h3>أكثر النطاقات طلبًا</h3>${bars(count(dns, r=>base(r.query||"")))}</div>
        <div class="card"><h3>أنواع سجلات DNS</h3>${bars(count(dns, r=>r.qtype_name), {color:()=>"var(--medium)"})}</div>
        <div class="card"><h3>المصادر</h3>${bars(count(conn, r=>r["id.orig_h"]), {color:()=>"var(--informational)"})}</div>
        <div class="card"><h3>الوجهات والمنافذ</h3>${bars(count(conn, r=>`${r["id.resp_h"]}:${r["id.resp_p"]}/${r.proto}`), {color:()=>"var(--informational)"})}</div>
      </div>`;
    return;
  }
  const isDns = state.tab === "dns";
  const src = isDns ? dns : conn;
  const cols = isDns ? ["ts","id.orig_h","id.resp_h","query","qtype_name","rcode_name","answers"]
                     : ["ts","id.orig_h","id.orig_p","id.resp_h","id.resp_p","proto","service","duration","orig_bytes","resp_bytes","conn_state"];
  const q = state.q.toLowerCase();
  const rows = src.map((r,i)=>({r,i})).filter(({r}) => !q || cols.some(k => String(r[k]||"").toLowerCase().includes(q)));
  c.innerHTML = toolbar(false, rows.length, src.length) + `<div class="wrap"><table>
    <thead><tr>${cols.map(k=>`<th class="ltr">${k}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(({r,i})=>`<tr class="r" data-i="${i}">${cols.map(k=>`<td class="mono ${k==="answers"?"trunc":""}">${esc(k==="ts"?fmtTime(parseTime(r[k])):r[k])}</td>`).join("")}</tr>
      ${state.open===i?`<tr class="detail"><td colspan="${cols.length}">${kvBlock(Object.entries(r).map(([k,v])=>k+"\u0000"+v), "\u0000")}</td></tr>`:""}`).join("")}
    </tbody></table></div>`;
  bindToolbar(); bindRows();
}

/* ---------- markdown (case README) ---------- */
function md(src){
  src = src.replace(/<\/?div[^>]*>/g, "");
  const out = []; let code = null, list = null;
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const closeList = () => { if (list){ out.push(`</${list}>`); list = null; } };
  for (const line of src.split("\n")){
    if (line.startsWith("```")){ if (code===null){ closeList(); code = []; } else { out.push(`<pre>${esc(code.join("\n"))}</pre>`); code = null; } continue; }
    if (code !== null){ code.push(line); continue; }
    let m;
    if ((m = line.match(/^(#{1,3})\s+(.*)/))){ closeList(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); }
    else if ((m = line.match(/^\d+\.\s+(.*)/))){ if (list!=="ol"){ closeList(); out.push("<ol>"); list="ol"; } out.push(`<li>${inline(m[1])}`); }
    else if ((m = line.match(/^\s*[-*]\s+(.*)/))){ if (!list){ out.push("<ul>"); list="ul"; } out.push(`<div>• ${inline(m[1])}</div>`); }
    else if (!line.trim()){ if (list!=="ol") closeList(); }
    else { closeList(); out.push(`<p>${inline(line)}</p>`); }
  }
  closeList();
  return out.join("\n");
}

window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if (id && id !== state.current) selectCase(id); });
loadCases();
