<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SOC Dashboard</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1016; --panel:#121a23; --panel2:#17212c; --line:#223040; --text:#dbe4ee; --muted:#8597aa;
  --accent:#3fb6c9; --critical:#e5484d; --high:#f2853a; --medium:#e5c23d; --low:#4fa3e0; --informational:#71808f;
  --ok:#3fbf7f; --mono:"JetBrains Mono",ui-monospace,monospace; --ar:"IBM Plex Sans Arabic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:14px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:var(--text)}
.app{display:grid;grid-template-columns:280px 1fr;height:100vh}
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand b{display:block;font-size:16px}
.brand span{color:var(--muted);font-size:12px}
.learn-btn{margin:0 12px 4px;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600}
.new-tag{background:var(--high);color:#1a0d02;border-radius:999px;padding:1px 8px;font-size:11px;margin-left:6px;vertical-align:1px}
.learn-btn.active{border-color:var(--accent);color:var(--accent)}
.learn{max-width:980px;margin:0 auto}
.learn td:first-child{direction:ltr;unicode-bidi:plaintext;text-align:right;white-space:nowrap}
.learn h2{font-size:18px;margin:30px 0 12px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.learn section:first-child h2{margin-top:0}
.learn h3{font-size:14.5px;margin:20px 0 8px;color:var(--muted)}
.learn table{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px}
.learn th{text-align:right;position:static}
.learn td,.learn th{text-align:right}
.learn li{margin:6px 0}
.learn a,.ar a{color:var(--accent)}
.hint{margin:6px 0}
.hint button{background:none;border:1px dashed var(--line);border-radius:8px;padding:6px 12px;color:var(--muted);font-size:12.5px}
.ar pre{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;direction:ltr;text-align:left;font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:8px 0 0}
.new-btn{margin:12px 12px 8px;background:var(--accent);color:#04161a;border:0;border-radius:8px;padding:9px 12px;font-weight:600}
.cases{overflow:auto;padding:4px 8px 16px;flex:1}
.foot{border-top:1px solid var(--line);padding:14px 16px}
.foot .who{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text)}
.foot .who img{width:36px;height:36px;border-radius:8px;display:block}
.foot .who b{display:block;font-size:14px;line-height:1.2}
.foot .who span{color:var(--muted);font-size:12px}
.social{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.social a{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:8px;color:var(--muted);background:var(--panel2)}
.social a:hover{color:var(--text);border-color:var(--accent)}
.social svg{width:16px;height:16px;fill:currentColor}
.group{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin:14px 10px 6px}
.case-btn{display:block;width:100%;text-align:left;background:none;border:1px solid transparent;border-radius:8px;padding:9px 12px;margin-bottom:3px}
.case-btn:hover{background:var(--panel2)}
.case-btn.active{background:var(--panel2);border-color:var(--line)}
.case-btn .num{font-family:var(--mono);color:var(--accent);font-size:11.5px}
.case-btn .t{display:block;font-weight:600}
.case-btn .meta{display:flex;gap:7px;align-items:center;color:var(--muted);font-size:12px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--informational);display:inline-block}
.dot.on{background:var(--ok)}
main{overflow:auto;min-width:0}
.head{position:sticky;top:0;z-index:5;background:rgba(11,16,22,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:16px 24px 0}
.head-row{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.head h1{margin:0;font-size:20px}
.sub{color:var(--muted);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;margin-top:2px}
.sub code{font-family:var(--mono);color:var(--text)}
.actions{display:flex;gap:8px}
.btn{background:var(--accent);color:#04161a;border:0;border-radius:8px;padding:8px 16px;font-weight:600}
.btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--critical);border:1px solid #4a2326}
.btn:disabled{opacity:.6;cursor:wait}
.tabs{display:flex;gap:4px;margin-top:14px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab.active{color:var(--text);border-color:var(--accent)}
.content{padding:20px 24px 48px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;position:relative;overflow:hidden}
.kpi .v{font-size:28px;font-weight:700;font-family:var(--mono);line-height:1.2}
.kpi .l{color:var(--muted);font-size:12.5px}
.kpi::before{content:"";position:absolute;inset:0 auto auto 0;width:3px;height:100%;background:var(--c,var(--accent))}
.two{grid-template-columns:1fr 1fr}
.mt{margin-top:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.card h3{margin:0 0 12px;font-size:14px;font-weight:600;color:var(--muted)}
.section-title{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin:24px 0 10px}
.bars .row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;margin-bottom:8px}
.bars .lbl{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bars .track{grid-column:1/-1;height:6px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:-4px}
.bars .fill{height:100%;border-radius:3px;background:var(--accent)}
.bars .n{font-family:var(--mono);font-size:12px;text-align:right}
.sev{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--panel2);margin-bottom:12px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.timeline svg{width:100%;height:150px;display:block}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12.5px;color:var(--muted)}
.chip.on{color:var(--text);border-color:var(--c,var(--accent));background:var(--panel2)}
.search,.select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px}
.search{flex:1;min-width:200px}
.count{color:var(--muted);font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{position:sticky;top:0;background:var(--panel2);color:var(--muted);font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
td.mono{white-space:nowrap}
tr.r{cursor:pointer}
tr.r:hover td{background:var(--panel2)}
.mono{font-family:var(--mono)}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto;max-height:72vh}
.badge{display:inline-block;padding:1px 8px;border-radius:4px;font-size:11.5px;font-weight:600;color:#0b1016;background:var(--c)}
.detail td{background:#0e151d;padding:12px 16px;white-space:normal}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-family:var(--mono);font-size:12px}
.kv .k{color:var(--accent)}
.kv .v{word-break:break-all;white-space:pre-wrap}
.trunc{max-width:560px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.more{display:block;margin:12px auto 0}
.empty{text-align:center;padding:56px 20px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:6px}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;max-width:820px;margin:22px auto 0;text-align:left}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px}
.step .n{font-family:var(--mono);color:var(--accent);font-size:12px}
.ar{direction:rtl;text-align:right;font-family:var(--ar)}
.ar code{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;background:var(--panel2);padding:0 4px;border-radius:4px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.q .qt{margin-bottom:8px}
.q .qt .qn{font-family:var(--mono);color:var(--accent);margin-left:8px;direction:ltr;unicode-bidi:isolate}
textarea{width:100%;min-height:64px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;resize:vertical;line-height:1.55}
textarea:focus,input:focus,select:focus{outline:1px solid var(--accent);border-color:var(--accent)}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field small{color:var(--muted);font-weight:400;margin-left:6px}
.save{color:var(--muted);font-size:12.5px}
.log{background:#05090d;border:1px solid var(--line);border-radius:8px;padding:12px;font-family:var(--mono);font-size:12px;white-space:pre-wrap;max-height:260px;overflow:auto;margin-bottom:14px}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;width:min(560px,100%)}
.modal h2{margin:0 0 4px;font-size:18px}
.modal p{margin:0 0 16px;color:var(--muted);font-size:13px}
.modal input[type=text],.modal textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;margin-bottom:12px}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:24px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:12px}
.drop.over{border-color:var(--accent);color:var(--text)}
.files{font-family:var(--mono);font-size:12px;margin:-4px 0 12px}
.files div{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.modal .row{display:flex;justify-content:flex-end;gap:8px;margin-top:6px}
.err{color:var(--critical);font-size:13px;margin-bottom:10px}
@media (max-width:900px){.app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:1px solid var(--line)}.cases{max-height:260px}.two{grid-template-columns:1fr}main{overflow:visible}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><b>SOC Hunting Lab</b><span>Threat Hunting Dashboard</span></div>
    <button class="new-btn" id="newCase">+ New Case</button>
    <button class="learn-btn" id="learn">Learn <span class="new-tag" id="learnTag" hidden>Start here</span></button>
    <div class="cases" id="cases"></div>
    <div class="foot">
      <a class="who" href="https://cybers-sa.com" target="_blank" rel="noopener"><img src="logo.jpg" alt="Cybers_SA"><div><b>Cybers_SA</b><span>@Cybers_SA</span></div></a>
      <div class="social"><a href="https://x.com/Cybers_SA" target="_blank" rel="noopener" title="X" aria-label="X"><svg viewBox="0 0 24 24"><path d="M18.9 1.2h3.7l-8 9.2 9.4 12.4h-7.4l-5.8-7.6-6.6 7.6H.5l8.6-9.8L.1 1.2h7.6l5.2 6.9 6-6.9zm-1.3 19.4h2L6.5 3.3H4.3l13.3 17.3z"/></svg></a><a href="https://www.linkedin.com/company/cybers-sa" target="_blank" rel="noopener" title="LinkedIn" aria-label="LinkedIn"><svg viewBox="0 0 24 24"><path d="M20.4 20.5h-3.6v-5.6c0-1.3 0-3-1.8-3s-2.1 1.4-2.1 2.9v5.7H9.3V9h3.4v1.6h.1c.5-.9 1.6-1.8 3.4-1.8 3.6 0 4.3 2.4 4.3 5.5v6.2zM5.3 7.4a2.1 2.1 0 1 1 0-4.2 2.1 2.1 0 0 1 0 4.2zM7.1 20.5H3.5V9h3.6v11.5zM22.2 0H1.8C.8 0 0 .8 0 1.7v20.6c0 .9.8 1.7 1.8 1.7h20.4c1 0 1.8-.8 1.8-1.7V1.7C24 .8 23.2 0 22.2 0z"/></svg></a><a href="https://whatsapp.com/channel/0029VbE3hTSGufIprSJ8ml3i" target="_blank" rel="noopener" title="WhatsApp" aria-label="WhatsApp"><svg viewBox="0 0 24 24"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5 2.5 1 3 .8 3.6.8.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.3-.6-.4zM12 21.8c-1.8 0-3.5-.5-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4c-1-1.6-1.5-3.4-1.5-5.2C2.2 6.6 6.6 2.2 12 2.2c2.6 0 5.1 1 6.9 2.9 1.9 1.9 2.9 4.3 2.9 6.9 0 5.4-4.4 9.8-9.8 9.8zM20.5 3.5C18.2 1.2 15.2 0 12 0 5.4 0 .1 5.3.1 11.9c0 2.1.5 4.1 1.6 5.9L0 24l6.3-1.7c1.7.9 3.7 1.4 5.7 1.4 6.6 0 11.9-5.3 11.9-11.9 0-3.2-1.2-6.2-3.4-8.3z"/></svg></a><a href="https://t.me/Cybers_SA" target="_blank" rel="noopener" title="Telegram" aria-label="Telegram"><svg viewBox="0 0 24 24"><path d="M23.9 3.5 20.3 20.6c-.3 1.2-1 1.5-2 .9l-5.5-4-2.6 2.5c-.3.3-.5.5-1.1.5l.4-5.6L19.7 5.6c.4-.4-.1-.6-.7-.2L6.4 13.3.9 11.6c-1.2-.4-1.2-1.2.3-1.7L22.4 1.7c1-.4 1.9.2 1.5 1.8z"/></svg></a><a href="https://github.com/cybers-sa" target="_blank" rel="noopener" title="GitHub   <main>
    <div class="head" id="head"></div>
    <div class="content" id="content"></div>

<div id="modal"></div>
<script>
const LEVELS = ["critical","high","medium","low","informational"];
const LEVEL_NAME = {critical:"Critical",high:"High",medium:"Medium",low:"Low",informational:"Info"};
const CASE_EN = {"case-08":"Password Phishing","case-09":"Overdue Invoice","case-10":"Employee Report","case-01":"Log Clearing","case-02":"Password Spraying","case-03":"Remote Execution","case-04":"Logon Screen Backdoor","case-05":"Process Memory Dump","case-06":"Domain Credential Theft","case-07":"Covert C2 Channel"};
const LEVEL_EN = {"مبتدئ":"Beginner","متوسط":"Intermediate","متقدم":"Advanced"};
const REPORT = [
  ["summary","Executive summary","What happened, in a few lines"],
  ["assets","Affected hosts and accounts",""],
  ["timeline","Timeline (UTC)","Key events in order"],
  ["mitre","MITRE ATT&CK techniques","e.g. T1003.006"],
  ["iocs","Indicators of compromise (IOCs)","IPs, domains, files, hashes, accounts"],
  ["recommendations","Recommendations","Containment, eradication and detection improvements"],
];
const caseTitle = c => CASE_EN[c.id] || c.title;
const caseLevel = c => LEVEL_EN[c.level] || c.level;
const state = { cases: [], current: null, data: null, tab: "overview", filter: new Set(LEVELS), q: "", open: null, limit: 300, eid: "", raw: {}, zlog: "", runLog: "" };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cssLevel = l => `var(--${LEVELS.includes(l) ? l : "informational"})`;
function parseTime(t){
  if (!t) return NaN;
  if (/^\d+(\.\d+)?$/.test(t)) return parseFloat(t) * 1000;
  const s = String(t).trim().replace(" UTC","Z").replace(/^(\d{4}-\d\d-\d\d) /,"$1T").replace(/ ([+-]\d\d:\d\d)$/,"$1");
  return Date.parse(s);
}
const fmtTime = ms => isNaN(ms) ? "" : new Date(ms).toISOString().replace("T"," ").slice(0,19);
function count(arr, key){
  const m = new Map();
  for (const x of arr){ let ks = key(x); ks = Array.isArray(ks) ? ks : [ks]; for (const k of ks) if (k !== "" && k != null) m.set(k, (m.get(k)||0)+1); }
  return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
async function api(path, opts){
  const r = await fetch(path, opts);
  let j = {}; try { j = await r.json(); } catch(e) {}
  if (!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* ---------- cases ---------- */
async function loadCases(select){
  state.cases = await api("/api/cases");
  renderCases();
  let seen = true; try { seen = !!localStorage.getItem("soc-learn-seen"); } catch(e) {}
  if (!seen) $("#learnTag").hidden = false;
  if (!select && (location.hash === "#learn" || (!location.hash && !seen))) return showLearn();
  const want = select || location.hash.slice(1) || (state.cases[0] && state.cases[0].id);
  if (want) await selectCase(state.cases.some(c=>c.id===want) ? want : state.cases[0].id);
}
function renderCases(){
  const item = c => `<button class="case-btn ${state.current===c.id?"active":""}" data-id="${c.id}">
      <span class="num">${esc(c.id.toUpperCase())}</span>
      <span class="t">${esc(caseTitle(c))}</span>
      <span class="meta"><span class="dot ${c.analyzed?"on":""}"></span>${c.analyzed?"Analyzed":"Not analyzed"} · ${esc(caseLevel(c))}</span>
    </button>`;
  const lab = state.cases.filter(c=>!c.custom), mine = state.cases.filter(c=>c.custom);

/* ---------- charts ---------- */
function bars(entries, opts={}){
  if (!entries.length) return `<div class="count">No data</div>`;
  const max = Math.max(1, ...entries.map(e=>e[1]));
  return `<div class="bars">${entries.slice(0, opts.limit||8).map(([k,n])=>`
    <div class="row"><span class="lbl" title="${esc(k)}">${esc(k)}</span><span class="n">${n}</span>
    <div class="track"><div class="fill" style="width:${n/max*100}%;background:${opts.color||"var(--accent)"}"></div></div></div>`).join("")}</div>`;
}
function timeline(times, levels){
  const pts = times.map((t,i)=>[t, levels ? levels[i] : "x"]).filter(p=>!isNaN(p[0]));
  if (!pts.length) return `<div class="count">No timestamps</div>`;
  let min = Math.min(...pts.map(p=>p[0])), max = Math.max(...pts.map(p=>p[0]));
  if (max === min){ min -= 30000; max += 30000; }
  const N = 40, W = 800, H = 130, bw = W / N;
  const bins = Array.from({length:N}, () => ({}));
  for (const [t,l] of pts){ const i = Math.min(N-1, Math.floor((t-min)/(max-min)*N)); bins[i][l] = (bins[i][l]||0)+1; }
  const top = Math.max(...bins.map(b => Object.values(b).reduce((a,c)=>a+c,0)));
  const order = levels ? [...LEVELS].reverse() : ["x"];
  let rects = "";
  bins.forEach((b,i) => { let y = H; for (const l of order){ const n = b[l]||0; if (!n) continue; const h = n/top*(H-6); y -= h;
    rects += `<rect x="${i*bw+1}" y="${y}" width="${bw-2}" height="${h}" rx="1.5" fill="${l==="x"?"var(--accent)":cssLevel(l)}"><title>${n}</title></rect>`; } });
  return `<svg viewBox="0 0 ${W} ${H+20}" preserveAspectRatio="none">${rects}
    <text x="0" y="${H+16}" fill="var(--muted)" font-size="11" font-family="JetBrains Mono,monospace">${fmtTime(min)}</text>
    <text x="${W}" y="${H+16}" fill="var(--muted)" font-size="11" text-anchor="end" font-family="JetBrains Mono,monospace">${fmtTime(max)}</text></svg>`;
}
const kpi = (v,l,c) => `<div class="kpi" style="--c:${c||"var(--accent)"}"><div class="v">${v}</div><div class="l">${l}</div></div>`;

const SUMMARY_KEYS = ["CommandLine","Image","TargetUserName","SubjectUserName","IpAddress","SourceIp","DestinationIp","QueryName","TargetFilename","TargetImage","ServiceName","ScriptBlockText","ObjectName","Properties","Status"];
function rawSummary(data){
  const out = [];
  for (const k of SUMMARY_KEYS){ const hit = Object.keys(data).find(x => x === k || x.endsWith("." + k)); if (hit) out.push(`${k}: ${data[hit]}`); if (out.length >= 3) break; }
  if (!out.length) for (const [k,v] of Object.entries(data).slice(0,3)) out.push(`${k}: ${v}`);
  return out.join(" | ");
}

/* ---------- investigation ---------- */
function parseReadme(src){
  src = src.replace(/<\/?(div|details)[^>]*>/g, "").replace(/<summary>.*?<\/summary>/g, "");
  const sections = []; let cur = null;
  for (const line of src.split("\n")){
    const m = line.match(/^##\s+(.*)/);
    if (m){ cur = {title:m[1].trim(), lines:[]}; sections.push(cur); }
    else if (cur) cur.lines.push(line);
  }
  return sections;
}
function mdInline(s){ return esc(s).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>").replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>'); }
function mdBlock(lines){ const out = []; let code = null; for (const l of lines){ if (l.trim().startsWith("```")){ if (code === null) code = []; else { out.push(`<pre>${esc(code.join("\n"))}</pre>`); code = null; } continue; } if (code !== null){ code.push(l); continue; } if (l.trim()) out.push(`<p style="margin:4px 0">${mdInline(l)}</p>`); } return out.join(""); }
function parseQuestions(lines){
  const qs = [];
  for (const l of lines){
    const m = l.match(/^\d+\.\s+(.*)/);
    if (m) qs.push(m[1]);
    else if (qs.length && l.trim().startsWith("-")) qs[qs.length-1] += "\n" + l.trim().replace(/^-\s*/,"");
  }
  return qs;
}
/* ---------- notes ---------- */
let noteTimer;
function saveNotes(d){
  const s = $("#saved"); if (s) s.textContent = "Saving...";

      let span = "1h"; let a = arg.replace(/span\s*=\s*(\S+)/i, (_, s) => { span = s; return ""; }).trim();
      const ms = spanMs(span); const [aggPart, byPart] = a.split(/\s+by\s+/i);
      const agg = [...(aggPart || "count").matchAll(/(\w+)(?:\(([^)]*)\))?/g)][0];
      rows = rows.map(r => ({...r, __bucket: fmtTime(Math.floor(parseTime(r._time) / ms) * ms)})).filter(r => r.__bucket);
      const by = byPart ? fieldList(byPart)[0] : null;
      const g = aggregate(rows, [{fn: agg[1].toLowerCase(), field: agg[2] || "", as: "v"}], by ? ["__bucket", by] : ["__bucket"]);
      if (by){ const keys = [...new Set(g.map(r => String(r[by])))]; const m2 = new Map(); for (const r of g){ if (!m2.has(r.__bucket)) m2.set(r.__bucket, {_time: r.__bucket}); m2.get(r.__bucket)[r[by]] = r.v; } rows = [...m2.values()]; cols = ["_time", ...keys]; }
      else { rows = g.map(r => ({_time: r.__bucket, [agg[0]]: r.v})); cols = ["_time", agg[0]]; }
      rows.sort((x,y) => x._time < y._time ? -1 : 1);
    }
    else if (cmd === "table" || cmd === "fields"){ cols = fieldList(arg).filter(f => f !== "-"); }
    else if (cmd === "rename"){ for (const mm of arg.matchAll(/([\w.()]+)\s+as\s+([\w.]+)/gi)){ rows = rows.map(r => { const v = fget(r, mm[1]); const o = {...r}; if (v !== undefined){ o[mm[2]] = v; delete o[mm[1]]; } if (o.__lc) o.__lc = {...o.__lc, [mm[2].toLowerCase()]: mm[2]}; return o; }); if (cols) cols = cols.map(c => c === mm[1] ? mm[2] : c); } }
    else if (cmd === "sort"){
      let limit = null; const a = arg.replace(/^(\d+)\s+/, (_, n) => { limit = +n; return ""; });
      const keys = fieldList(a).map(k => ({desc: k.startsWith("-"), f: k.replace(/^[-+]/, "")}));
      rows = [...rows].sort((x,y) => { for (const k of keys){ const a1 = fget(x, k.f), b1 = fget(y, k.f); let c = isNum(a1) && isNum(b1) ? a1 - b1 : String(a1 ?? "").localeCompare(String(b1 ?? "")); if (c) return k.desc ? -c : c; } return 0; });
      if (limit) rows = rows.slice(0, limit);
    }
    else if (cmd === "head") rows = rows.slice(0, +(arg || 10));
    else if (cmd === "tail") rows = rows.slice(-(+(arg || 10)));
    else if (cmd === "dedup"){ const f = fieldList(arg); const seen = new Set(); rows = rows.filter(r => { const k = f.map(x => String(fget(r, x))).join("\u0001"); if (seen.has(k)) return false; seen.add(k); return true; }); }
    else if (cmd === "eval"){
      const mm = arg.match(/^([\w.]+)\s*=\s*(lower|upper|len)\(([\w.]+)\)$/i);
      if (!mm) throw new Error("eval supports: field=lower(x), upper(x), len(x)");
      rows = rows.map(r => { const v = String(fget(r, mm[3]) ?? ""); const o = {...r, [mm[1]]: mm[2].toLowerCase() === "lower" ? v.toLowerCase() : mm[2].toLowerCase() === "upper" ? v.toUpperCase() : v.length}; if (o.__lc) o.__lc = {...o.__lc, [mm[1].toLowerCase()]: mm[1]}; return o; });
      if (cols) cols.push(mm[1]);
    }
    else throw new Error(`Unknown command: ${cmd}`);
  }
  return {rows, cols};
}
function examplesFor(d){
  const ex = [];
  if (d.has_evtx) ex.push(
    ["Events by ID", "index=windows | stats count by EventID | sort -count"],
    ["Process tree", "index=windows EventID=1 | stats count by ParentImage, Image"],
    ["Command lines", "index=windows EventID=1 | table _time Computer User CommandLine"],
    ["Failed logons", "index=windows EventID=4625 OR EventID=4771 | stats count by TargetUserName, IpAddress"],
    ["Alerts by rule", "index=alerts level!=informational | stats count by level, rule | sort -count"],
    ["Alert timeline", "index=alerts | timechart span=1m count by level"]);
  if (d.has_pcap) ex.push(
    ["Top DNS queries", "index=zeek sourcetype=dns | top limit=10 query"],
    ["TXT records", "index=zeek sourcetype=dns qtype_name=TXT | table _time id.orig_h id.resp_h query"],
    ["Talkers", "index=zeek sourcetype=conn | stats count sum(orig_bytes) as sent by id.orig_h, id.resp_h, id.resp_p | sort -count"]);
  if (d.has_email) ex.push(["Email auth", "index=email | table subject from reply_to spf dkim dmarc"]);
  return ex;
}
async function renderSearch(box, d){
  if (d.has_evtx && !state.raw[d.id]){
    box.innerHTML = `<div class="empty"><b>Loading events...</b></div>`;
    try { state.raw[d.id] = await api("/api/raw?id=" + encodeURIComponent(d.id)); } catch(e){ box.innerHTML = `<div class="empty"><b>Could not load events</b>${esc(e.message)}</div>`; return; }
    if (state.tab !== "search" || state.current !== d.id) return;
  }
  if (!state.events || state.eventsFor !== d.id){ state.events = buildEvents(d); state.eventsFor = d.id; }
  const ex = examplesFor(d);
  state.spl = state.spl ?? (ex[0] ? ex[0][1] : "*");
  let res, err = "";
  try { res = runQuery(state.events, state.spl); } catch(e){ err = e.message; }
  const idx = count(state.events, e => e.index);
  box.innerHTML = `
    <div class="card"><div style="display:flex;gap:8px">
      <input class="search mono" id="spl" value="${esc(state.spl)}" spellcheck="false" style="font-size:13px">
      <button class="btn" id="go">Search</button></div>
      <div class="toolbar" style="margin:10px 0 0">${ex.map(([n,q])=>`<button class="chip" data-q="${esc(q)}">${esc(n)}</button>`).join("")}</div>
      <div class="count" style="margin-top:8px">Indexes: ${idx.map(([k,n])=>`<code class="mono">index=${esc(k)}</code> (${n})`).join(" · ")} · Commands: stats, top, rare, timechart, table, sort, head, tail, where, dedup, rename, eval, search</div></div>
    <div class="mt" id="res"></div>`;
  const resEl = $("#res");
  if (err) resEl.innerHTML = `<div class="log" style="color:var(--critical)">${esc(err)}</div>`;
  else {
    const rows = res.rows;
    let cols = res.cols;
    const isRaw = !cols;
    if (isRaw) cols = ["_time", "index", "sourcetype", "_raw"];
    const shown = rows.slice(0, state.limit);
    const cell = (r, c) => { if (c === "_raw") return Object.entries(r).filter(([k]) => !k.startsWith("_") && !["index","sourcetype"].includes(k)).slice(0, 6).map(([k,v]) => `${k}=${v}`).join("  "); const v = fget(r, c); return c === "_time" && v && !/^\d{4}-\d\d-\d\d \d\d:\d\d:\d\d$/.test(v) ? fmtTime(parseTime(v)) : v; };
    const chart = !isRaw && cols.length >= 2 && rows.length > 1 && rows.length <= 50 && rows.every(r => isNum(fget(r, cols[cols.length-1])));
    resEl.innerHTML = `<div class="count" style="margin-bottom:8px">${rows.length} results</div>
      ${chart ? `<div class="card" style="margin-bottom:14px">${bars(rows.map(r => [cols.slice(0,-1).map(c => cell(r,c)).join(" · ") || cols[0], +fget(r, cols[cols.length-1])]), {limit: 15})}</div>` : ""}
      ${rows.length ? `<div class="wrap"><table><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>
        ${shown.map((r,i)=>`<tr class="${isRaw?"r":""}" data-i="${i}">${cols.map(c=>`<td class="mono ${c==="_raw"?"trunc":""}" style="${c!=="_raw"?"white-space:pre-wrap":""}">${esc(cell(r,c) ?? "")}</td>`).join("")}</tr>
          ${isRaw && state.open===i ? `<tr class="detail"><td colspan="${cols.length}">${kvBlock(Object.entries(r).filter(([k])=>!k.startsWith("__")))}</td></tr>` : ""}`).join("")}
      </tbody></table></div>${moreBtn(shown.length, rows.length)}` : ""}`;
  }
  const spl = $("#spl");
  const go = () => { state.spl = spl.value; state.limit = 300; state.open = null; render(); };
  $("#go").onclick = go;
  spl.onkeydown = e => { if (e.key === "Enter") go(); };
  box.querySelectorAll(".chip[data-q]").forEach(b => b.onclick = () => { state.spl = b.dataset.q; state.limit = 300; state.open = null; render(); });
  const m = $("#more"); if (m) m.onclick = () => { state.limit += 500; keepScroll(render); };
  bindRows();
}

/* ---------- new case ---------- */
function openNewCase(){
  let files = [];
  const m = $("#modal");
  m.innerHTML = `<div class="modal-bg"><div class="modal">
    <h2>New Case</h2><p>Upload Windows event logs (.evtx), network captures (.pcap, .pcapng) or emails (.eml). Use lab or CTF data only.</p>
    <input type="text" id="nc-title" placeholder="Case title, e.g. Suspicious PowerShell on HR-PC">
    <textarea id="nc-desc" placeholder="Scenario or notes (optional)" dir="auto"></textarea>
    <div class="drop" id="drop">Drop files here or click to choose<input type="file" id="nc-file" multiple accept=".evtx,.pcap,.pcapng,.cap,.eml" hidden></div>
    <div class="files" id="nc-files"></div><div class="err" id="nc-err"></div>
    <div class="row"><button class="btn ghost" id="nc-cancel">Cancel</button><button class="btn" id="nc-go" disabled>Create and Analyze</button></div>
  </div></div>`;
  const drop = $("#drop"), input = $("#nc-file");
  const ok = f => /\.(evtx|pcap|pcapng|cap|eml)$/i.test(f.name);
  const show = () => {
    $("#nc-files").innerHTML = files.map(f=>`<div><span>${esc(f.name)}</span><span>${(f.size/1048576).toFixed(1)} MB</span></div>`).join("");
    $("#nc-go").disabled = !files.length;
  };
  const add = list => { const bad = [...list].filter(f=>!ok(f)); files = files.concat([...list].filter(ok)); $("#nc-err").textContent = bad.length ? `Skipped: ${bad.map(f=>f.name).join(", ")}` : ""; show(); };
  drop.onclick = e => { if (e.target !== input) input.click(); };
  input.onchange = () => add(input.files);
  drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
  drop.ondragleave = () => drop.classList.remove("over");
  drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); add(e.dataTransfer.files); };
  $("#nc-cancel").onclick = () => m.innerHTML = "";
  $("#nc-go").onclick = async () => {
    const go = $("#nc-go"); go.disabled = true;
    try {
      go.textContent = "Creating case...";
      const {id} = await api("/api/new", {method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({title: $("#nc-title").value.trim() || files[0].name, description: $("#nc-desc").value.trim()})});
      for (const [i,f] of files.entries()){
        go.textContent = `Uploading ${i+1}/${files.length}...`;
        await api(`/api/upload?id=${id}&file=${encodeURIComponent(f.name)}`, {method:"POST", body:f});
      }
      go.textContent = "Analyzing...";
      const r = await api("/api/run?id=" + id, {method:"POST"});
      m.innerHTML = "";
      state.current = null; await loadCases(id);
      if (!r.ok){ state.runLog = r.output; render(); }
    } catch(e){ $("#nc-err").textContent = e.message; go.disabled = false; go.textContent = "Create and Analyze"; }
  };
}
$("#newCase").onclick = openNewCase;
$("#learn").onclick = showLearn;
loadCases();
